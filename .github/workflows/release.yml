name: Changesets
on:
  push:
    branches:
      - main
env:
  CI: true
  
jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: npm exchanges this job's OIDC token for a
      # short-lived publish token, so the workflow keeps no npm secret.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESET_ACTIONS }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: yarn install

      - name: build 
        run: |
          yarn prepare
          yarn package:check
          yarn package:packed-check

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          commit: 'release: version packages'
          title: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESET_ACTIONS }}

      # rnrc-codemod is versioned by hand in codemod/package.json, outside
      # Changesets. Publish it through the same trusted publisher whenever
      # that version is not on npm yet.
      - name: Publish rnrc-codemod
        working-directory: codemod
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "rnrc-codemod@$version" version > /dev/null 2>&1; then
            echo "rnrc-codemod@$version is already published"
          else
            npm publish
          fi
