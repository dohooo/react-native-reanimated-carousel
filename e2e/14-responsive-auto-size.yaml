appId: ${APP_ID}
name: Responsive Auto Size
---

- stopApp
- launchApp:
    clearState: false

- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "http://localhost:8081"
    timeout: 15000
    optional: true

- tapOn:
    text: "http://localhost:8081"
    optional: true

- tapOn:
    text: "http://127.0.0.1:8081"
    optional: true

- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true

- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: "Close"
    optional: true

# Retry once in case the development server appears during the onboarding wait.
- tapOn:
    text: "http://localhost:8081"
    optional: true

- tapOn:
    text: "http://127.0.0.1:8081"
    optional: true

- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: "Close"
    optional: true

- waitForAnimationToEnd:
    timeout: 8000

- extendedWaitUntil:
    visible: "Basic Layouts"
    timeout: 180000

# Deep-link delivery to the freshly launched app is unreliable on CI
# simulators: the URL can be silently dropped while the JS side is still
# booting, and iOS can show a system confirmation dialog (`Open in "app"?`)
# well after any fixed wait window — while it is up it blocks the whole UI.
# Re-send the link every pass and dismiss the dialog whenever it appears;
# on Android (no dialog, reliable delivery) the loop exits on the first pass.
- repeat:
    times: 8
    while:
      notVisible: "Web Release Smoke"
    commands:
      - openLink: "rnrc-example-app://demos/e2e-testing/web-release-smoke"
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn:
                text: "Open"
      - extendedWaitUntil:
          visible: "Web Release Smoke"
          timeout: 20000
          optional: true

- extendedWaitUntil:
    visible: "Web Release Smoke"
    timeout: 30000

- extendedWaitUntil:
    visible: "Horizontal Item Width: 320"
    timeout: 30000

- tapOn:
    id: "horizontal-next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Horizontal Index: 1"
- assertVisible: "Horizontal Slide 1"

- tapOn:
    id: "horizontal-resize"
- extendedWaitUntil:
    visible: "Horizontal Item Width: 520"
    timeout: 30000
- assertVisible: "Horizontal Index: 1"

- tapOn:
    id: "horizontal-next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Horizontal Index: 0"
- assertVisible: "Horizontal Slide 0"

- scrollUntilVisible:
    element: "Vertical Item Height: 240"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "vertical-next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Vertical Index: 1"
- assertVisible: "Vertical Slide 1"

- tapOn:
    id: "vertical-resize"
- scrollUntilVisible:
    element: "Vertical Item Height: 420"
    direction: DOWN
    timeout: 30000
- assertVisible: "Vertical Index: 1"

- tapOn:
    id: "vertical-next"
    point: "50%,20%"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Vertical Index: 0"
- assertVisible: "Vertical Slide 0"
