appId: ${APP_ID}
name: Responsive Auto Size
---

- stopApp
- launchApp:
    clearState: false

- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "http://localhost:8081"
    timeout: 15000
    optional: true

- tapOn:
    text: "http://localhost:8081"
    optional: true

- tapOn:
    text: "http://127.0.0.1:8081"
    optional: true

- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true

- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: "Close"
    optional: true

# Retry once in case the development server appears during the onboarding wait.
- tapOn:
    text: "http://localhost:8081"
    optional: true

- tapOn:
    text: "http://127.0.0.1:8081"
    optional: true

- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: "Close"
    optional: true

- waitForAnimationToEnd:
    timeout: 8000

- extendedWaitUntil:
    visible: "Basic Layouts"
    timeout: 180000

- openLink: "rnrc-example-app://demos/e2e-testing/web-release-smoke"

# The deep link can trigger an iOS system confirmation dialog (`Open in "app"?`).
# On slow CI simulators that dialog can appear well after any fixed wait window,
# and while it is up it blocks the whole UI. Interleave dismissing the dialog
# with waiting for the target screen so the dialog is handled whenever it
# appears; on Android (no dialog) the loop exits on the first pass.
- repeat:
    times: 12
    while:
      notVisible: "Web Release Smoke"
    commands:
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn:
                text: "Open"
      - extendedWaitUntil:
          visible: "Web Release Smoke"
          timeout: 15000
          optional: true

- extendedWaitUntil:
    visible: "Web Release Smoke"
    timeout: 30000

- extendedWaitUntil:
    visible: "Horizontal Item Width: 320"
    timeout: 30000

- tapOn:
    id: "horizontal-next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Horizontal Index: 1"
- assertVisible: "Horizontal Slide 1"

- tapOn:
    id: "horizontal-resize"
- extendedWaitUntil:
    visible: "Horizontal Item Width: 520"
    timeout: 30000
- assertVisible: "Horizontal Index: 1"

- tapOn:
    id: "horizontal-next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Horizontal Index: 0"
- assertVisible: "Horizontal Slide 0"

- scrollUntilVisible:
    element: "Vertical Item Height: 240"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "vertical-next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Vertical Index: 1"
- assertVisible: "Vertical Slide 1"

- tapOn:
    id: "vertical-resize"
- scrollUntilVisible:
    element: "Vertical Item Height: 420"
    direction: DOWN
    timeout: 30000
- assertVisible: "Vertical Index: 1"

- tapOn:
    id: "vertical-next"
    point: "50%,20%"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Vertical Index: 0"
- assertVisible: "Vertical Slide 0"
